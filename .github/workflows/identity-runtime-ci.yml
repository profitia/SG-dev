name: Identity Runtime B2 source
on:
  pull_request:
    paths: ['apps/identity-runtime/**', 'packages/platform-contracts/**', '.github/workflows/identity-runtime-ci.yml', 'Canon/evidence/2026-10-22-identity-b1-m1-closeout.md', 'Canon/evidence/2026-10-22-identity-b2-session-compatibility.md', 'Canon/runbooks/identity-runtime-b2-consumer-adoption-v1.md']
  push:
    branches: [main]
    paths: ['apps/identity-runtime/**', 'packages/platform-contracts/**', '.github/workflows/identity-runtime-ci.yml']
permissions:
  contents: read
concurrency:
  group: identity-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  session-security:
    name: Exact candidate session and navigation security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Deterministic public dependencies without credentials or lifecycle scripts
        run: npm --prefix apps/identity-runtime ci --ignore-scripts --no-audit --no-fund
      - name: Lint, types, executable build, session and request tests
        working-directory: apps/identity-runtime
        run: npm run lint && npm run typecheck && npm run build && npm test
      - name: Preserve both existing consumer adoption contracts
        run: npm --prefix apps/sg-runtime run test:platform-contract && npm --prefix apps/srm run test:platform-contract
      - name: Required governance manifest and regression
        run: node scripts/governance/validate-governance-manifest.mjs && node --test scripts/governance/governance.test.mjs scripts/governance/development-workspace.test.mjs
      - name: Validate exact SHA and all changed paths through canonical CI governance
        working-directory: apps/identity-runtime
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run ci:proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-runtime-b2-source-proof
          path: apps/identity-runtime/dist/b2-source-proof.json
          if-no-files-found: error
          retention-days: 30
  producer-regression:
    name: Unchanged platform producer and real isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sg2_operation_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      OPERATION_FIXTURE_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/sg2_operation_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned synthetic fixture dependencies
        run: npm --prefix apps/architecture-lab ci --ignore-scripts --no-audit --no-fund && npm --prefix packages/platform-contracts ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged producer and lab including B1 and current candidate compatibility
        run: node --test packages/platform-contracts/test/*.test.mjs apps/architecture-lab/test/*.test.mjs
