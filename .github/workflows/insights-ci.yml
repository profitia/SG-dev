name: Insights report backend
on:
  pull_request:
    paths:
      [
        "apps/insights-runtime/**",
        "packages/insights-contracts/**",
        ".github/workflows/insights-ci.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/insights-runtime/**",
        "packages/insights-contracts/**",
        ".github/workflows/insights-ci.yml",
      ]
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insights_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: insights_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Install isolated public dependencies and pinned renderer
        run: |
          npm --prefix apps/insights-runtime ci --install-links --ignore-scripts --no-audit --no-fund
          python -m pip install -r apps/insights-runtime/render/requirements.txt
      - name: Validate manifest and Insights routing
        run: |
          node scripts/governance/validate-governance-manifest.mjs
          node scripts/governance/governance-preflight.mjs --ci --project SG2 --workspace 'GitHub Actions' --execution-environment ci --target-environment development --task-id CI-INSIGHTS --host-conversation-unavailable --title 'Insights CI' --scope implementation --target apps/insights-runtime/src/runner.mjs --target packages/insights-contracts/index.mjs --target .github/workflows/insights-ci.yml
      - name: Install test schema and ordinary non-owner role
        env:
          PGHOST: 127.0.0.1
          PGUSER: insights_test_owner
          PGPASSWORD: isolated_ci_only
          PGDATABASE: insights_test
        run: |
          psql -v ON_ERROR_STOP=1 -f apps/insights-runtime/sql/001-report-editions.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE insights_test_runtime LOGIN PASSWORD 'isolated_runtime_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; GRANT USAGE ON SCHEMA insights_private TO insights_test_runtime; GRANT SELECT,INSERT,UPDATE ON insights_private.report_jobs TO insights_test_runtime; GRANT SELECT,INSERT ON insights_private.report_artifacts TO insights_test_runtime;"
      - name: Test contracts, DST, actual PostgreSQL isolation, API, recovery and PDF
        working-directory: apps/insights-runtime
        env:
          INSIGHTS_TEST_DATABASE_URL: postgresql://insights_test_runtime:isolated_runtime_only@127.0.0.1:5432/insights_test
          INSIGHTS_TEST_RENDER: "true"
          INSIGHTS_TEST_OWNER_DATABASE_URL: postgresql://insights_test_owner:isolated_ci_only@127.0.0.1:5432/insights_test
        run: npm test && npm run build
      # No provider credentials, no model credentials, no paid requests/deployments.
