name: Assistant Context Gateway source
on:
  pull_request:
    paths:
      - 'packages/assistant-context-contracts/**'
      - 'packages/assistant-context-gateway/**'
      - 'packages/platform-contracts/src/assistant-*'
      - 'packages/platform-contracts/test/assistant-*'
      - 'packages/platform-contracts/migrations/access/030-assistant-operations.sql'
      - 'apps/sg-runtime/migrations/assistant/**'
      - 'apps/sg-runtime/tests/assistant-history-postgres.test.mjs'
      - '.github/workflows/assistant-context-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/assistant-context-contracts/**'
      - 'packages/assistant-context-gateway/**'
      - 'packages/platform-contracts/src/assistant-*'
      - 'packages/platform-contracts/test/assistant-*'
      - 'packages/platform-contracts/migrations/access/030-assistant-operations.sql'
      - 'apps/sg-runtime/migrations/assistant/**'
      - 'apps/sg-runtime/tests/assistant-history-postgres.test.mjs'
      - '.github/workflows/assistant-context-gateway-ci.yml'
permissions:
  contents: read
jobs:
  contracts:
    name: ACG producer isolation and chart version contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check packages/assistant-context-contracts/src/index.mjs && node --check packages/assistant-context-gateway/src/index.mjs
      - run: node --test packages/assistant-context-contracts/test/*.test.mjs packages/assistant-context-gateway/test/*.test.mjs
  native-e1:
    name: Assistant native E1 and paid admission boundaries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sg2_operation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      OPERATION_FIXTURE_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/sg2_operation_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix apps/architecture-lab ci --ignore-scripts --no-audit --no-fund && npm --prefix packages/platform-contracts ci --ignore-scripts --no-audit --no-fund
      - run: node --test packages/platform-contracts/test/assistant-*.test.mjs packages/platform-contracts/test/operation-context.test.mjs
      - name: Native private history when the SG2 source is adopted
        if: hashFiles('apps/sg-runtime/migrations/assistant/**', 'apps/sg-runtime/tests/assistant-history-postgres.test.mjs') != ''
        run: |
          test -f apps/sg-runtime/migrations/assistant/001-history.sql
          test -f apps/sg-runtime/tests/assistant-history-postgres.test.mjs
          node --test apps/sg-runtime/tests/assistant-history-postgres.test.mjs
