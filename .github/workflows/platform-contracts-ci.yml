name: Platform contract integration
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-sg2' && inputs.candidate_pr != '' && format('SG2 proof PR #{0} @ {1}', inputs.candidate_pr, inputs.expected_sha) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/platform-contracts/**'
      - 'packages/srm-xray/**'
      - 'apps/architecture-lab/**'
      - 'apps/dashboard-preview/**'
      - 'apps/sg-runtime/**'
      - 'apps/srm/**'
      - 'Canon/registries/development-workspaces-v1.json'
      - 'Canon/registries/profitia-projects-v1.json'
      - 'Canon/registries/architecture-environment-topology-v1.json'
      - '.github/workflows/platform-contracts-ci.yml'
      - 'scripts/governance/controlled-package-ci*'
      - 'scripts/governance/development-execution*'
      - 'Canon/registries/controlled-source-admissions-v1.json'
      - 'Canon/registries/development-execution-profiles-v1.json'
      - 'scripts/governance/project-profile.mjs'
      - 'scripts/governance/routing-engine.mjs'
      - 'scripts/architecture-classify.mjs'
      - 'Canon/registries/current-architecture-baseline-v1.json'
  push:
    branches: [main]
    paths:
      - 'packages/platform-contracts/**'
      - 'packages/srm-xray/**'
      - 'apps/architecture-lab/**'
      - 'apps/dashboard-preview/**'
      - 'apps/sg-runtime/**'
      - 'apps/srm/**'
      - 'Canon/registries/development-workspaces-v1.json'
      - 'Canon/registries/profitia-projects-v1.json'
      - 'Canon/registries/architecture-environment-topology-v1.json'
      - '.github/workflows/platform-contracts-ci.yml'
      - 'scripts/governance/controlled-package-ci*'
      - 'scripts/governance/development-execution*'
      - 'Canon/registries/controlled-source-admissions-v1.json'
      - 'Canon/registries/development-execution-profiles-v1.json'
      - 'scripts/governance/project-profile.mjs'
      - 'scripts/governance/routing-engine.mjs'
      - 'scripts/architecture-classify.mjs'
      - 'Canon/registries/current-architecture-baseline-v1.json'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [integration, validate-sg2, policy-probe, test-only-pr1283]
        default: integration
      candidate_pr:
        description: 'Internal SG2/SRM or bounded Architecture producer PR; empty validates exact main'
        type: string
      source_admission_id:
        description: 'Optional trusted-main source admission record ID; never candidate authority'
        type: string
      expected_sha:
        description: 'Exact candidate HEAD, or the approved composition commit in test-only-pr1283'
        type: string
      approved_workflow_sha:
        description: 'Owner-approved main commit containing this workflow, required only for test-only-pr1283'
        type: string
      approved_workflow_blob:
        description: 'Independently approved workflow blob, required only for test-only-pr1283'
        type: string

permissions:
  contents: read

jobs:
  producer:
    name: ${{ github.event.action == 'ready_for_review' && 'Architecture readiness no-op' || 'Architecture contract and lab' }}
    if: inputs.mode != 'test-only-pr1283' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sg2_operation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPERATION_FIXTURE_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/sg2_operation_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public isolated test fixture dependencies
        run: npm --prefix apps/architecture-lab ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned public transport classifier without credentials or lifecycle scripts
        run: npm --prefix packages/platform-contracts ci --ignore-scripts --no-audit --no-fund && npm --prefix packages/platform-contracts/current-e1-authority ci --install-links --ignore-scripts --no-audit --no-fund
      - name: Link optional FRESH composition to the existing local SDK without credentials or lifecycle scripts
        run: npm --prefix packages/platform-contracts/current-fresh-report ci --ignore-scripts --no-audit --no-fund
      - name: Test canonical and optional contracts in isolated PostgreSQL
        run: node --test packages/platform-contracts/test/*.test.mjs apps/architecture-lab/test/*.test.mjs packages/platform-contracts/current-fresh-report/test/*.test.mjs
      - name: Validate registered routing and workspace isolation
        run: node --test scripts/governance/governance.test.mjs scripts/governance/development-workspace.test.mjs scripts/governance/controlled-package-ci.test.mjs scripts/governance/controlled-package-ci-path-coverage.test.mjs scripts/governance/development-execution.test.mjs

  dashboard-source-regression:
    name: ${{ github.event.action == 'ready_for_review' && 'Dashboard readiness no-op' || 'SG2 dashboard source regression' }}
    if: github.event.action != 'ready_for_review' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'integration')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install existing public dependencies without registry credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate existing database clients without connecting to a database
        run: npm run postinstall
      - name: Exercise dashboard regressions, typecheck and build without deployment
        run: npm test && npm run typecheck && npm run build
      - name: Check real production HTTP refusal before protected routes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {resolve} from 'node:path';
          import {setTimeout as pause} from 'node:timers/promises';
          const base = 'http://127.0.0.1:38002';
          const server = spawn(process.execPath, [resolve('node_modules/next/dist/bin/next'), 'start', '--hostname', '127.0.0.1', '--port', '38002'], {
            env: {...process.env, PROFITIA_AUTH_PROVIDER: 'clerk', TARGET_ENVIRONMENT: 'development', APP_ENV: 'development'},
            stdio: 'ignore',
          });
          let startupError;
          server.on('error', error => { startupError = error; });
          const closed = new Promise(resolve => server.once('close', resolve));
          try {
            let ready = false;
            for (let attempt = 0; attempt < 150; attempt++) {
              if (startupError || server.exitCode !== null) throw new Error('Isolated dashboard failed to start');
              try { await fetch(base + '/en', {signal: AbortSignal.timeout(1000)}); ready = true; break; }
              catch { await pause(100); }
            }
            assert(ready, 'Isolated dashboard startup timeout');
            for (const path of ['/en', '/pl', '/api/records?organizationId=forged&pipelineId=forged', '/api/series?seriesId=synthetic']) {
              const response = await fetch(base + path, {redirect: 'manual', signal: AbortSignal.timeout(5000), headers: {
                Cookie: 'sg_porr_demo_session_development=forged', Authorization: 'Bearer synthetic_unverified',
                'x-clerk-user-id': 'forged', 'x-clerk-org-id': 'forged',
                'x-middleware-subrequest': 'middleware:middleware:middleware:middleware:middleware',
              }});
              assert.equal(response.status, 503, path);
              assert.equal(response.headers.get('cache-control'), 'private, no-store');
              const vary = response.headers.get('vary').toLowerCase().split(',').map(v => v.trim());
              assert(vary.includes('cookie') && vary.includes('authorization'));
              assert.equal(response.headers.get('location'), null);
            }
            console.log('PASS: four real HTTP refusals; no named-user adoption or database access claimed');
          } finally {
            server.kill('SIGTERM');
            await Promise.race([closed, pause(3000)]);
            if (server.exitCode === null && server.signalCode === null) server.kill('SIGKILL');
          }
          JS
      - name: Record dashboard source validation boundary
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          fs.writeFileSync('/tmp/dashboard-source-proof.json', JSON.stringify({
            projectKey: 'SG2', targetEnvironment: 'development', scope: 'DASHBOARD_SOURCE_REGRESSION',
            validationSha: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
            candidateHeadSha: process.env.CANDIDATE_HEAD_SHA, tests: 'PASS', typecheck: 'PASS', build: 'PASS',
            productionHttpRefusal: 'PASS', productDeploymentPerformed: false, customerIdentityAdapterVerified: false,
          }, null, 2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg2-dashboard-source-proof
          path: /tmp/dashboard-source-proof.json
          retention-days: 30
          if-no-files-found: error

  consumers:
    name: ${{ github.event.action == 'ready_for_review' && format('{0} adoption readiness no-op', matrix.project) || format('{0} contract adoption', matrix.project) }}
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: SG2
            directory: apps/sg-runtime
          - project: SRM
            directory: apps/srm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual consumer binding and explicitly accepted source digest
        working-directory: ${{ matrix.directory }}
        run: npm run test:platform-contract
      - name: Record sanitized validation identity
        working-directory: ${{ matrix.directory }}
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const accepted = JSON.parse(fs.readFileSync('development-integration.json', 'utf8'));
          fs.writeFileSync('/tmp/platform-integration-proof.json', JSON.stringify({projectKey: accepted.projectKey, targetEnvironment: 'development', acceptedVersion: accepted.contract.acceptedVersion, sourceDigest: accepted.contract.sourceDigest, producerSourceSha: accepted.producer.sourceSha, validationSha: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(), candidateHeadSha: process.env.CANDIDATE_HEAD_SHA, productDeploymentPerformed: false}, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: platform-contract-${{ matrix.project }}
          path: /tmp/platform-integration-proof.json
          retention-days: 30

  sg2-operation-integration:
    name: SG2 operation integration
    needs: controlled-sg2
    # Drafts cannot merge. Exact-source verification runs when review starts.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'integration') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve explicit adoption without silently skipping an existing adapter
        id: adoption
        env:
          DIRECTORY: apps/sg-runtime
          ADAPTER: apps/sg-runtime/lib/benchmark/operation-context.ts
        run: |
          if [ -f "$DIRECTORY/operation-integration.json" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ -f "$ADAPTER" ]; then
            echo 'Adapter exists without explicit contract adoption' >&2
            exit 1
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Operation-context integration is not adopted by this source; no runtime proof claimed.'
          fi
      - name: Checkout authority controller for public SG2 proof verification
        if: steps.adoption.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
          path: trusted-control
          persist-credentials: false
      - name: Verify controlled SG2 proof for the exact candidate without package access
        if: steps.adoption.outputs.enabled == 'true' && github.event.action != 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node trusted-control/scripts/governance/controlled-package-ci.mjs verify
      - name: Verify published exact SG2 proof on ready for review
        if: steps.adoption.outputs.enabled == 'true' && github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';

          const repo = 'profitia/SG-dev';
          const workflow = '.github/workflows/platform-contracts-ci.yml';
          const sha = process.env.EXPECTED_SHA;
          const number = process.env.CANDIDATE_PR;
          assert.match(sha, /^[a-f0-9]{40}$/);
          assert.match(number, /^[1-9][0-9]*$/);
          const get = endpoint => JSON.parse(execFileSync('gh', ['api', 'repos/' + repo + '/' + endpoint], {
            encoding: 'utf8', timeout: 15000, maxBuffer: 4 * 1024 * 1024,
          }));
          const checkPr = () => {
            const pr = get('pulls/' + number);
            assert.ok(pr.number === Number(number) && pr.state === 'open' && pr.draft === false
              && pr.user?.login === 'profitia' && pr.head?.repo?.full_name === repo
              && pr.base?.repo?.full_name === repo && pr.base?.ref === 'main' && pr.head?.sha === sha,
              'SG2_PROOF_PR_IDENTITY_CHANGED');
          };
          checkPr();
          const { id: workflowId } = get('actions/workflows/platform-contracts-ci.yml');
          const title = 'SG2 proof PR #' + number + ' @ ' + sha;
          const trusted = run => run.workflow_id === workflowId && run.path === workflow
            && run.repository?.full_name === repo && run.head_repository?.full_name === repo
            && run.head_branch === 'main' && run.event === 'workflow_dispatch'
            && run.actor?.login === 'profitia' && run.triggering_actor?.login === 'profitia';
          const runs = get('actions/workflows/' + workflowId + '/runs?branch=main&event=workflow_dispatch&per_page=50').workflow_runs;
          const exact = runs.filter(run => trusted(run) && run.display_title === title);
          assert.ok(exact.length <= 1, 'SG2_PRODUCERS_CONFLICT');
          const eligible = new Map(runs.filter(run => trusted(run) && run.status === 'completed'
            && run.conclusion === 'success' && run.run_attempt === 1
            && (exact.length ? run.id === exact[0].id : !run.display_title?.startsWith('SG2 proof PR #')))
            .map(run => [String(run.id), run]));
          assert.ok(eligible.size > 0, 'SG2_PROOF_NOT_READY');

          // The authority-main verifier checks the original artifact and policy. This step
          // binds its successful choice to the admitted PR and pins the original attempt.
          const output = execFileSync('node', ['trusted-control/scripts/governance/controlled-package-ci.mjs', 'verify'], {
            encoding: 'utf8', timeout: 120000, maxBuffer: 1024 * 1024,
          }).trim();
          const match = output.match(/https:\/\/github\.com\/profitia\/SG-dev\/actions\/runs\/([1-9][0-9]*)$/);
          const selected = match && eligible.get(match[1]);
          assert.ok(selected, 'SG2_PROOF_PRODUCER_MISMATCH');
          const endpoint = 'actions/runs/' + selected.id;
          const completed = get(endpoint);
          const artifacts = get(endpoint + '/artifacts').artifacts.filter(artifact =>
            artifact.name === 'sg2-controlled-operation-proof' && artifact.expired === false);
          assert.ok(completed.id === selected.id && trusted(completed) && completed.head_sha === selected.head_sha
            && completed.run_attempt === 1 && completed.status === 'completed' && completed.conclusion === 'success',
            'SG2_PROOF_ATTEMPT_CHANGED');
          assert.ok(artifacts.length === 1 && artifacts[0].workflow_run?.id === selected.id
            && artifacts[0].workflow_run?.head_sha === selected.head_sha
            && /^sha256:[a-f0-9]{64}$/.test(artifacts[0].digest), 'SG2_PROOF_ARTIFACT_INVALID');
          checkPr();
          console.log(output);
          JS

  operations:
    name: ${{ github.event.action == 'ready_for_review' && 'SRM operation readiness no-op' || format('{0} operation integration', matrix.project) }}
    needs: controlled-sg2
    # Readiness only schedules the SG2 verifier. Preserve the prior SRM check context.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'integration') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: SRM
            directory: apps/srm
            database: srm_app
            adapter: apps/srm/src/server/operation-report-data.ts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ${{ matrix.database }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve explicit adoption without silently skipping an existing adapter
        id: adoption
        env:
          DIRECTORY: ${{ matrix.directory }}
          ADAPTER: ${{ matrix.adapter }}
        run: |
          if [ -f "$DIRECTORY/operation-integration.json" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ -f "$ADAPTER" ]; then
            echo 'Adapter exists without explicit contract adoption' >&2
            exit 1
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Operation-context integration is not adopted by this source; no runtime proof claimed.'
          fi
      - name: Install public test-fixture dependencies
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM'
        run: npm --prefix apps/architecture-lab ci --ignore-scripts --no-audit --no-fund
      - name: Clean application dependency installation
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM'
        working-directory: ${{ matrix.directory }}
        run: npm ci --install-links --no-audit --no-fund
      - name: Actual API, ordinary-role persistence, revocation and audit rollback
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM'
        working-directory: ${{ matrix.directory }}
        env:
          SG2_OPERATION_TEST_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/sg2_operation_test
          SRM_OPERATION_TEST_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/srm_app
        run: npm run test:operation-context
      - name: Typecheck and application build without deployment
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM'
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck && npm run build
      - name: Record exact isolated validation source
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM'
        working-directory: ${{ matrix.directory }}
        env:
          PROJECT_KEY: ${{ matrix.project }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const receipt=JSON.parse(fs.readFileSync('operation-integration.json','utf8'));
          fs.writeFileSync('/tmp/operation-context-proof.json',JSON.stringify({projectKey:process.env.PROJECT_KEY,targetEnvironment:'development',scope:'ISOLATED_API_AND_PERSISTENCE',validationSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),candidateHeadSha:process.env.CANDIDATE_HEAD_SHA,contract:receipt.contract,productDeploymentPerformed:false,customerIdentityAdapterVerified:false},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: steps.adoption.outputs.enabled == 'true' && matrix.project == 'SRM' && success()
        with:
          name: operation-context-${{ matrix.project }}
          path: /tmp/operation-context-proof.json
          retention-days: 30

  controlled-sg2:
    name: SG2 controlled operation integration
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'validate-sg2' || inputs.mode == 'test-only-pr1283')))
    concurrency:
      group: ${{ inputs.mode == 'test-only-pr1283' && 'sg2-pr1283-test-only' || format('sg2-controlled-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: architecture-development
    permissions:
      contents: read
      actions: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architecture_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sg2_operation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted control to the provider-pinned main snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          git -C control update-ref refs/remotes/origin/main "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reserve exact PR 1283 test-only execution
        id: test_only_reservation
        if: inputs.mode == 'test-only-pr1283'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.candidate_pr }}
          REQUESTED_COMMIT: ${{ inputs.expected_sha }}
          REQUESTED_SOURCE_RECORD: ${{ inputs.source_admission_id }}
          APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
          APPROVED_WORKFLOW_BLOB: ${{ inputs.approved_workflow_blob }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const e = process.env;
          const controlSha = '2712ff7718e1ee8f6478df08f7eef41ee84c5be9';
          const candidateSha = '4765688a54e749bd7b44c3547f1ffab501299943';
          const candidateHead = 'd55713ee638837a281ffa7bb908bb1b2de2f5767';
          const tree = '386a52773b3fae98911fbf9da657c175d33e6233';
          const workflow = '.github/workflows/platform-contracts-ci.yml';
          const git = (...args) => execFileSync('git', ['-C', 'control', ...args], {encoding: 'utf8'}).trim();
          const api = (endpoint, paginate = false) => JSON.parse(execFileSync('gh', ['api', ...(paginate ? ['--paginate', '--slurp'] : []), endpoint], {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024}));
          assert.equal(e.GITHUB_EVENT_NAME, 'workflow_dispatch');
          assert.equal(e.GITHUB_RUN_ATTEMPT, '1');
          assert.equal(e.REQUESTED_PR, '1283');
          assert.equal(e.REQUESTED_COMMIT, candidateSha);
          assert.equal(e.REQUESTED_SOURCE_RECORD, '');
          assert.match(e.APPROVED_WORKFLOW_SHA, /^[a-f0-9]{40}$/);
          assert.match(e.APPROVED_WORKFLOW_BLOB, /^[a-f0-9]{40}$/);
          assert.equal(e.GITHUB_WORKFLOW_SHA, e.GITHUB_SHA);
          assert.equal(git('rev-parse', 'HEAD'), e.GITHUB_WORKFLOW_SHA);
          git('merge-base', '--is-ancestor', e.APPROVED_WORKFLOW_SHA, 'HEAD');
          const isUnrelatedDocument = file => /^Canon\/proposals\/bsdc\/[\w./-]+\.md$/.test(file)
            && !file.split('/').includes('AGENTS.md');
          const verifyAuthority = ref => {
            assert.equal(git('rev-parse', ref + ':' + workflow), e.APPROVED_WORKFLOW_BLOB);
            const changed = git('diff', '--no-renames', '--name-only', controlSha, ref).split('\n').filter(Boolean);
            assert.ok(changed.every(file => file === workflow || isUnrelatedDocument(file)), 'Trusted execution inputs changed');
          };
          verifyAuthority(e.APPROVED_WORKFLOW_SHA);
          verifyAuthority('HEAD');

          // Project-card edits can advance main without changing the pinned controller, SDK or test inputs.
          const { REPOSITORY, assertTrustedContext, assertEnvironment } = await import('./control/scripts/governance/controlled-package-ci.mjs');
          assertTrustedContext({repository: e.GITHUB_REPOSITORY, ref: e.GITHUB_REF, workflowRef: e.GITHUB_WORKFLOW_REF,
            event: e.GITHUB_EVENT_NAME, actor: e.GITHUB_ACTOR, triggeringActor: e.GITHUB_TRIGGERING_ACTOR, controlSha});
          const repo = `repos/${REPOSITORY}`;
          const registered = JSON.parse(fs.readFileSync('control/Canon/registries/architecture-environment-topology-v1.json')).environments.development.github;
          const endpoint = `${repo}/environments/${encodeURIComponent(registered.environmentName)}`;
          assertEnvironment(api(endpoint), api(`${endpoint}/deployment-branch-policies`).branch_policies, registered);
          const liveMain = api(repo + '/git/ref/heads/main').object.sha;
          assert.match(liveMain, /^[a-f0-9]{40}$/);
          if (liveMain !== e.GITHUB_WORKFLOW_SHA) git('fetch', '--no-tags', 'origin', liveMain);
          git('merge-base', '--is-ancestor', e.GITHUB_WORKFLOW_SHA, liveMain);
          verifyAuthority(liveMain);
          const pr = api(`${repo}/pulls/1283`);
          assert.equal(pr.state, 'open');
          assert.equal(pr.draft, true);
          assert.equal(pr.changed_files, 3);
          assert.equal(pr.user.login, 'profitia');
          assert.equal(pr.head.repo.full_name, REPOSITORY);
          assert.equal(pr.base.repo.full_name, REPOSITORY);
          assert.equal(pr.base.ref, 'main');
          assert.equal(pr.head.sha, candidateHead);
          const commit = api(`${repo}/git/commits/${candidateSha}`);
          assert.equal(commit.sha, candidateSha);
          assert.equal(commit.tree.sha, tree);
          assert.deepEqual(commit.parents.map(parent => parent.sha), [controlSha, candidateHead]);

          // The job group serializes reservations. A completed reservation consumes the approval even if a later step fails.
          const workflowId = api(`${repo}/actions/workflows/platform-contracts-ci.yml`).id;
          const run = api(`${repo}/actions/runs/${e.GITHUB_RUN_ID}`);
          assert.equal(run.workflow_id, workflowId);
          assert.equal(run.head_sha, e.GITHUB_WORKFLOW_SHA);
          const since = encodeURIComponent('>=' + git('show', '-s', '--format=%cI', controlSha));
          const list = repo + '/actions/workflows/' + workflowId + '/runs?branch=main&event=workflow_dispatch&created=' + since + '&per_page=100';
          const pages = api(list, true);
          const history = pages.flatMap(page => page.workflow_runs);
          assert.ok(pages[0].total_count < 1000 && history.length === pages[0].total_count, 'Cannot establish complete execution history');
          for (const previous of history) {
            if (String(previous.id) === e.GITHUB_RUN_ID) continue;
            const jobs = api(`${repo}/actions/runs/${previous.id}/attempts/1/jobs?per_page=100`, true).flatMap(page => page.jobs);
            assert.ok(!jobs.some(job => (job.steps ?? []).some(step => step.name === 'Reserve exact PR 1283 test-only execution' && step.conclusion === 'success')),
              'Exact test-only execution already consumed');
          }
          fs.appendFileSync(e.GITHUB_OUTPUT, `candidate_sha=${candidateSha}\n`);
          JS
      - name: Verify access to exact trusted package artifacts before candidate checkout
        env:
          PACKAGE_CREDENTIAL_MODE: github-token
          NPM_TOKEN: ${{ github.token }}
        run: node control/scripts/governance/controlled-package-ci.mjs credential-preflight
      - name: Verify trusted control, provider policy and immutable internal candidate
        id: resolution
        if: inputs.mode != 'test-only-pr1283'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          SOURCE_ADMISSION_ID: ${{ inputs.source_admission_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node control/scripts/governance/controlled-package-ci.mjs resolve
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.resolution.outputs.adopted == 'true' || steps.test_only_reservation.outputs.candidate_sha != ''
        with:
          ref: ${{ steps.resolution.outputs.candidate_sha || steps.test_only_reservation.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Validate candidate files without executing candidate code
        if: steps.resolution.outputs.adopted == 'true'
        run: node control/scripts/governance/controlled-package-ci.mjs check-candidate
      - name: Prepare isolated mutable execution checkout from verified source
        id: execution
        if: steps.resolution.outputs.adopted == 'true' || steps.test_only_reservation.outputs.candidate_sha != ''
        env:
          TEST_ONLY: "${{ inputs.mode == 'test-only-pr1283' }}"
        run: |
          if [ "$TEST_ONLY" != true ]; then
            node control/scripts/governance/controlled-package-ci.mjs prepare-execution
            exit
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import { assertPristineSourceInput, checkAdmittedPackages, createExecutionCheckout } from './control/scripts/governance/controlled-package-ci.mjs';
          import { sdkSourceContext } from './control/packages/platform-contracts/test/sdk-source-context.mjs';
          const e = process.env;
          const control = path.resolve('control');
          const candidate = path.resolve(e.CANDIDATE_ROOT);
          const controlSha = '2712ff7718e1ee8f6478df08f7eef41ee84c5be9';
          const sourceSha = '4765688a54e749bd7b44c3547f1ffab501299943';
          const tree = '386a52773b3fae98911fbf9da657c175d33e6233';
          const head = 'd55713ee638837a281ffa7bb908bb1b2de2f5767';
          const git = (...args) => execFileSync('git', ['-C', candidate, ...args], {stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 16 * 1024 * 1024});
          const command = (...args) => git(...args).toString().trim();
          assertPristineSourceInput(candidate, sourceSha);
          assert.equal(command('rev-list', '--parents', '-n', '1', sourceSha), `${sourceSha} ${controlSha} ${head}`);
          assert.equal(command('rev-parse', 'HEAD^{tree}'), tree);
          const files = new Map([
            ['apps/architecture-lab/current-sdk-source.json', '9e626c859f83ddb1baee8a7ef1bba4107f5e7a19'],
            ['scripts/governance/controlled-package-ci.mjs', '6e10a4ae49ca5bd3c3be080caa4053e35affde30'],
            ['scripts/governance/controlled-package-ci.test.mjs', '206afe78938840d0eb0492bca6091274b0d82ee6'],
          ]);
          for (const line of command('diff-tree', '--no-commit-id', '-r', '--raw', '--no-abbrev', controlSha, sourceSha).split('\n')) {
            const [header, file] = line.split('\t');
            const [fromMode, toMode, , blob, status] = header.split(' ');
            assert.equal(fromMode, ':100644');
            assert.equal(toMode, '100644');
            assert.equal(status, 'M');
            assert.ok(files.has(file));
            assert.equal(blob, files.get(file));
            files.delete(file);
          }
          assert.equal(files.size, 0);
          const show = (sha, file) => git('show', `${sha}:${file}`);
          const sdk = sdkSourceContext(file => show(sourceSha, file), show);
          const lock = 'apps/sg-runtime/package-lock.json';
          assert.deepEqual(show(sourceSha, lock), fs.readFileSync(path.join(control, lock)));
          checkAdmittedPackages(candidate, control);
          const state = createExecutionCheckout(candidate, sourceSha, controlSha, e.RUNNER_TEMP);
          assert.equal(state.executionTreeSha, tree);
          fs.writeFileSync(path.join(e.RUNNER_TEMP, 'sg2-test-only-pr1283-state.json'), JSON.stringify({...state, controlSha, sdkRecordSha256: sdk.recordSha256}), {mode: 0o600});
          fs.appendFileSync(e.GITHUB_OUTPUT, `execution_root=${state.executionRoot}\n`);
          JS
      - name: Read-only credential phase; clean install with lifecycle scripts disabled
        if: steps.resolution.outputs.adopted == 'true' || steps.test_only_reservation.outputs.candidate_sha != ''
        env:
          PACKAGE_CREDENTIAL_MODE: github-token
          NPM_TOKEN: ${{ github.token }}
          EXECUTION_ROOT: ${{ steps.execution.outputs.execution_root }}
          TEST_ONLY: "${{ inputs.mode == 'test-only-pr1283' }}"
        run: |
          if [ "$TEST_ONLY" != true ]; then
            node control/scripts/governance/controlled-package-ci.mjs install
            exit
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import { assertExecutionCheckout, assertPristineSourceInput, checkAdmittedPackages, PRIVATE_PACKAGES } from './control/scripts/governance/controlled-package-ci.mjs';
          const e = process.env;
          const state = JSON.parse(fs.readFileSync(path.join(e.RUNNER_TEMP, 'sg2-test-only-pr1283-state.json')));
          const ready = JSON.parse(fs.readFileSync(path.join(e.RUNNER_TEMP, 'controlled-package-access.json')));
          assert.equal(ready.controlSha, e.GITHUB_WORKFLOW_SHA);
          assert.equal(ready.runId, e.GITHUB_RUN_ID);
          assert.equal(ready.mode, 'github-token');
          assert.deepEqual(ready.privatePackages, PRIVATE_PACKAGES);
          assert.ok(e.NPM_TOKEN);
          const root = assertExecutionCheckout(e.EXECUTION_ROOT, e.CANDIDATE_ROOT, state, e.RUNNER_TEMP);
          assertPristineSourceInput(root, state.sha);
          const control = path.resolve('control');
          const app = checkAdmittedPackages(root, control);
          const config = fs.mkdtempSync(path.join(e.RUNNER_TEMP, 'sg2-test-only-npm-'));
          try {
            const npmrc = path.join(config, '.npmrc');
            fs.copyFileSync(path.join(control, 'apps/sg-runtime/.npmrc'), npmrc);
            fs.chmodSync(npmrc, 0o600);
            const env = {PATH: e.PATH, HOME: config, NPM_TOKEN: e.NPM_TOKEN,
              NPM_CONFIG_USERCONFIG: npmrc, NPM_CONFIG_GLOBALCONFIG: '/dev/null', NPM_CONFIG_CACHE: path.join(config, 'cache')};
            const command = spawnSync('npm', ['ci', '--install-links', '--ignore-scripts', '--no-audit', '--no-fund'], {cwd: app, env, maxBuffer: 32 * 1024 * 1024});
            assert.equal(command.status, 0, 'Exact test-only dependency installation failed');
          } finally {
            fs.rmSync(config, {recursive: true, force: true});
          }
          assertPristineSourceInput(root, state.sha);
          JS
      - name: Verify clean exact execution inputs after credential phase ended
        if: steps.resolution.outputs.adopted == 'true'
        env:
          EXECUTION_ROOT: ${{ steps.execution.outputs.execution_root }}
        run: node control/scripts/governance/controlled-package-ci.mjs check-execution-input
      - name: Run lifecycle, real API tests, typecheck and build after credential phase ended
        id: sg2_validation
        if: steps.resolution.outputs.adopted == 'true' || steps.test_only_reservation.outputs.candidate_sha != ''
        working-directory: ${{ steps.execution.outputs.execution_root }}/apps/sg-runtime
        env:
          CANDIDATE_ROOT: ${{ steps.execution.outputs.execution_root }}
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          SG2_OPERATION_TEST_OWNER_URL: postgresql://architecture_test_owner:isolated_ci_only@127.0.0.1:5432/sg2_operation_test
        run: |
          node ${{ github.workspace }}/control/scripts/governance/controlled-package-ci.mjs assert-credential-free
          npm rebuild --foreground-scripts
          npm run postinstall --if-present
          npm --prefix ../architecture-lab ci --ignore-scripts --no-audit --no-fund
          npm run test:operation-context
          npm run typecheck
          npm run build
      - name: Record sanitized exact-source proof after successful execution
        if: steps.resolution.outputs.adopted == 'true'
        env:
          EXECUTION_ROOT: ${{ steps.execution.outputs.execution_root }}
        run: node control/scripts/governance/controlled-package-ci.mjs proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resolution.outputs.adopted == 'true' && success()
        with:
          name: sg2-controlled-operation-proof
          path: ${{ runner.temp }}/sg2-controlled-operation-proof/proof.json
          retention-days: 30
          if-no-files-found: error
      - name: Record independent test-only execution receipt
        if: steps.test_only_reservation.outputs.candidate_sha != '' && steps.sg2_validation.outcome == 'success'
        env:
          EXECUTION_ROOT: ${{ steps.execution.outputs.execution_root }}
        run: |
          node control/scripts/governance/controlled-package-ci.mjs assert-credential-free
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { assertExecutionCheckout, assertPristineSourceInput, PRIVATE_PACKAGES, WORKFLOW } from './control/scripts/governance/controlled-package-ci.mjs';
          const e = process.env;
          const state = JSON.parse(fs.readFileSync(path.join(e.RUNNER_TEMP, 'sg2-test-only-pr1283-state.json')));
          assertPristineSourceInput(e.CANDIDATE_ROOT, state.sha);
          assertPristineSourceInput(path.resolve('control'), e.GITHUB_WORKFLOW_SHA);
          assertExecutionCheckout(e.EXECUTION_ROOT, e.CANDIDATE_ROOT, state, e.RUNNER_TEMP);
          execFileSync('git', ['-C', e.EXECUTION_ROOT, 'diff', '--quiet', 'HEAD', '--']);
          const lock = JSON.parse(fs.readFileSync('control/apps/sg-runtime/package-lock.json'));
          const packages = PRIVATE_PACKAGES.map(name => {
            const { version, integrity } = lock.packages[`node_modules/${name}`];
            return { name, version, integrity };
          });
          fs.writeFileSync(path.join(e.RUNNER_TEMP, 'sg2-test-only-pr1283-proof.json'), JSON.stringify({
            scope: 'TEST_ONLY_EXECUTION', repository: e.GITHUB_REPOSITORY, pr: 1283,
            candidateSha: state.sha, treeSha: state.executionTreeSha, controlSha: state.controlSha, sdkRecordSha256: state.sdkRecordSha256,
            workflow: WORKFLOW, workflowSourceSha: e.GITHUB_WORKFLOW_SHA,
            runId: e.GITHUB_RUN_ID, runAttempt: e.GITHUB_RUN_ATTEMPT, packages,
            executionWorkspace: 'ISOLATED_GIT_CHECKOUT', credentialRemovedBeforeCandidateExecution: true,
            sourceInputVerifiedBeforeExecution: true, sourceInputVerifiedAfterExecution: true,
            tests: 'PASS', typecheck: 'PASS', build: 'PASS', sourceAdmissionPerformed: false,
          }, null, 2), {mode: 0o600});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.test_only_reservation.outputs.candidate_sha != '' && steps.sg2_validation.outcome == 'success' && success()
        with:
          name: sg2-test-only-pr1283-proof
          path: ${{ runner.temp }}/sg2-test-only-pr1283-proof.json
          retention-days: 30
          if-no-files-found: error

  environment-policy-probe:
    name: Main-only environment policy probe
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'policy-probe'
    runs-on: ubuntu-latest
    environment: architecture-development
    permissions: {}
    steps:
      # Deliberately no ref condition: the provider must reject a non-main run.
      - name: Assert actual provider admission; no package or secret access
        run: |
          test "$GITHUB_REF" = refs/heads/main
          echo MAIN_ONLY_ENVIRONMENT_POLICY_PASS
