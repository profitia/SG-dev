name: Governance preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [ready_for_review]
  workflow_run:
    workflows: [Platform contract integration]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/governance-preflight.yml'
      - 'Canon/**'
      - 'scripts/governance/**'
      - 'apps/pmos/**'
      - 'apps/pcos-explorer/**'
      - 'render.yaml'

jobs:
  gv02-coordinate:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.repository_id == '1247665550' &&
          (vars.GV02_ROUTINE_ENABLED == 'true' || vars.GV02_SHADOW_PR != '') &&
          (github.event_name == 'pull_request_target' ||
           (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: gv02-coordinate-${{ github.event.pull_request.head.sha || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha) || github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Request exact R1 evidence or isolated verification
        env:
          GH_TOKEN: ${{ github.token }}
          GV02_CONTROL_SHA: ${{ vars.GV02_ROUTINE_CONTROL_SHA }}
          GV02_ROUTINE_ENABLED: ${{ vars.GV02_ROUTINE_ENABLED }}
          GV02_ROUTINE_MERGE_ENABLED: ${{ vars.GV02_ROUTINE_MERGE_ENABLED }}
          GV02_SHADOW_PR: ${{ vars.GV02_SHADOW_PR }}
        run: node scripts/governance/publish-gv02-r1-proof.mjs coordinate

  gv02-baseline:
    name: ${{ github.base_ref == 'main' && 'sgdev-gv02-pr-baseline' || 'Governance PR scope' }}
    if: >-
      ${{ github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || github.event.action != 'ready_for_review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      governance_scope: ${{ steps.source.outputs.governance_scope }}
    steps:
      - name: Bind the PR to the exact GitHub integration tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = profitia/SG-dev
          test "$GITHUB_REPOSITORY_ID" = 1247665550

          read -r number base_ref head < <(jq -er '
            select(.repository.id==1247665550 and .pull_request.base.repo.id==1247665550)
            | [.number,.pull_request.base.ref,.pull_request.head.sha] | @tsv' "$GITHUB_EVENT_PATH")
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          for oid in "$head" "$GITHUB_SHA"; do
            [[ "$oid" =~ ^[a-f0-9]{40}$ ]]
          done
          test "$GITHUB_REF" = "refs/pull/$number/merge"
          repo=repos/profitia/SG-dev

          read_pull() {
            gh api "$repo/pulls/$number" | jq -ce --argjson number "$number" \
              --arg ref "$base_ref" --arg head "$head" --arg merge "$GITHUB_SHA" '
              select(.number==$number and .state=="open" and .merged==false
                and .base.repo.id==1247665550 and .base.ref==$ref
                and .head.sha==$head and .merge_commit_sha==$merge)
              | {number,changed_files}'
          }

          if [[ "$base_ref" == main ]]; then
            # Pull-request metadata can retain an older base SHA after the test merge is refreshed.
            base=$(gh api "$repo/git/ref/heads/main" --jq .object.sha)
            [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          fi

          pull=$(read_pull)
          # An incomplete path list retains the existing full governance job.
          governance_scope=true
          count=$(jq -er '.changed_files' <<<"$pull")
          if [[ "$count" =~ ^[0-9]+$ ]] && (( count <= 3000 )); then
            if pages=$(gh api "$repo/pulls/$number/files?per_page=100" --paginate --slurp) &&
              matched=$(jq -er --argjson count "$count" '
                def governance_path: test("^(AGENTS[.]md|[.]github/copilot-instructions[.]md|[.]github/workflows/governance-preflight[.]yml|render[.]yaml)$|^(Canon/|scripts/governance/|apps/pmos/|apps/pcos-explorer/)");
                if type=="array" and all(.[]; type=="array") then add // [] else error("invalid page") end
                | select(length==$count and all(.[]; .filename|type=="string"))
                | any(.[]; (.filename|governance_path) or ((.previous_filename // "")|governance_path))
                | tostring' <<<"$pages"); then
              governance_scope=$matched
            fi
          fi

          test "$(read_pull)" = "$pull"
          printf 'governance_scope=%s\n' "$governance_scope" >> "$GITHUB_OUTPUT"
          # Keep the original governance path selection for PRs targeting other branches.
          if [[ "$base_ref" != main ]]; then
            exit 0
          fi

          tree=$(gh api "$repo/git/commits/$GITHUB_SHA" | jq -er \
            --arg merge "$GITHUB_SHA" --arg base "$base" --arg head "$head" '
            select(.sha==$merge and [.parents[].sha]==[$base,$head])
            | .tree.sha | select(test("^[a-f0-9]{40}$"))')

          test "$(read_pull)" = "$pull"
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$base"
          jq -n --argjson repo "$GITHUB_REPOSITORY_ID" --argjson pr "$number" \
            --arg base "$base" --arg head "$head" --arg merge "$GITHUB_SHA" \
            --arg tree "$tree" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{repositoryId:$repo,pr:$pr,base:$base,head:$head,testMerge:$merge,tree:$tree,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/gv02-pr-baseline.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.base_ref == 'main'
        with:
          name: gv02-pr-baseline
          path: ${{ runner.temp }}/gv02-pr-baseline.json
          retention-days: 14
          if-no-files-found: error

  governance:
    needs: gv02-baseline
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.action != 'ready_for_review' &&
          (needs.gv02-baseline.result != 'success' ||
          needs.gv02-baseline.outputs.governance_scope != 'false'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate governance manifest
        run: node scripts/governance/validate-governance-manifest.mjs
      - name: Test governance validators
        run: node --test scripts/governance/governance.test.mjs scripts/governance/identity-runtime-onboarding.test.mjs scripts/governance/krs-registry-routing.test.mjs scripts/governance/ecr-routing.test.mjs scripts/governance/acg-canon-manifest-compatibility.test.mjs
      - name: Install PMOS dependencies
        working-directory: apps/pmos
        run: npm ci
      - name: Generate PMOS database client
        working-directory: apps/pmos
        run: npm run db:generate
      - name: Type-check PMOS
        working-directory: apps/pmos
        run: npm run typecheck && npm run typecheck:lifecycle
      - name: Test PMOS lifecycle and PHR gates
        working-directory: apps/pmos
        run: >-
          node_modules/.bin/tsx --test
          src/lib/pmos/execution-registration.test.ts
          src/lib/pmos/historical-estate.test.ts
          src/lib/pmos/project-profile.test.ts
          src/lib/pmos/phr-publication.test.ts
          scripts/pmos-save.test.ts
          src/lib/pmos/recovery-estate.test.ts
      - name: Run repository governance gate
        run: >-
          node scripts/governance/governance-preflight.mjs
          --ci
          --mode development
          --task-id CI-GOVERNANCE-PREFLIGHT
          --conversation-id CI-GOVERNANCE-PREFLIGHT
          --title "Governance CI"
          --project "SpendGuru 2.0"
          --target-environment development
          --workspace "GitHub Actions"
          --execution-environment ci
          --scope governance
          --target AGENTS.md
          --target Canon/v3.0-profitia-agent-execution-canon.md
          --target Canon/registries/profitia-projects-v1.json
          --target scripts/governance/governance-preflight.mjs
      - name: Run SRM Development environment gate
        run: >-
          node scripts/governance/governance-preflight.mjs
          --ci
          --mode development
          --task-id CI-SRM-GOVERNANCE-PREFLIGHT
          --conversation-id CI-SRM-GOVERNANCE-PREFLIGHT
          --title "SRM Development Governance CI"
          --project SRM
          --target-environment development
          --workspace "GitHub Actions"
          --execution-environment ci
          --scope governance
          --target Canon/registries/profitia-projects-v1.json
          --target Canon/registries/srm-environment-topology-v1.json
          --target scripts/governance/environment-profile.mjs
