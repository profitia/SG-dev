name: Governance preflight

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/governance-preflight.yml'
      - 'Canon/**'
      - 'scripts/governance/**'
      - 'apps/pmos/**'
      - 'apps/pcos-explorer/**'
      - 'render.yaml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/governance-preflight.yml'
      - 'Canon/**'
      - 'scripts/governance/**'
      - 'apps/pmos/**'
      - 'apps/pcos-explorer/**'
      - 'render.yaml'

jobs:
  governance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg2_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: sg2_immutable_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sg2_test -d sg2_immutable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate governance manifest
        run: node scripts/governance/validate-governance-manifest.mjs
      - name: Test governance validators
        run: node --test scripts/governance/governance.test.mjs
      - name: Install PMOS dependencies
        working-directory: apps/pmos
        run: npm ci
      - name: Generate PMOS database client
        working-directory: apps/pmos
        run: npm run db:generate
      - name: Type-check PMOS
        working-directory: apps/pmos
        run: npm run typecheck && npm run typecheck:lifecycle
      - name: Initialize isolated SG2 lifecycle test schema
        working-directory: apps/pmos
        env:
          DATABASE_URL: postgresql://sg2_test:isolated_ci_only@127.0.0.1:5432/sg2_immutable_test
          PGPASSWORD: isolated_ci_only
        run: |
          node_modules/.bin/prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/sg2-immutable-schema.sql"
          psql -h 127.0.0.1 -U sg2_test -d sg2_immutable_test -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/sg2-immutable-schema.sql"
      - name: Test SG2 immutable lifecycle on isolated PostgreSQL
        working-directory: apps/pmos
        env:
          SG2_IMMUTABLE_TEST_DATABASE_URL: postgresql://sg2_test:isolated_ci_only@127.0.0.1:5432/sg2_immutable_test
        run: >-
          node_modules/.bin/tsx --test
          src/lib/pmos/sg2-immutable-lifecycle.test.ts
          src/lib/pmos/sg2-immutable-lifecycle.integration.test.ts
          src/lib/pmos/flight-record-read.test.ts
          src/components/conversations/Sg2LifecycleStatus.test.tsx
          src/components/event-ledger/EventLedgerTable.test.tsx
      - name: Test PMOS lifecycle and PHR gates
        working-directory: apps/pmos
        run: >-
          node_modules/.bin/tsx --test
          src/lib/pmos/execution-registration.test.ts
          src/lib/pmos/historical-estate.test.ts
          src/lib/pmos/project-profile.test.ts
          src/lib/pmos/phr-publication.test.ts
          scripts/pmos-save.test.ts
          src/lib/pmos/recovery-estate.test.ts
      - name: Run repository governance gate
        run: >-
          node scripts/governance/governance-preflight.mjs
          --ci
          --mode development
          --task-id CI-GOVERNANCE-PREFLIGHT
          --conversation-id CI-GOVERNANCE-PREFLIGHT
          --title "Governance CI"
          --project "SpendGuru 2.0"
          --target-environment development
          --workspace "GitHub Actions"
          --execution-environment ci
          --scope governance
          --target AGENTS.md
          --target Canon/v3.0-profitia-agent-execution-canon.md
          --target Canon/registries/profitia-projects-v1.json
          --target scripts/governance/governance-preflight.mjs
      - name: Run SRM Development environment gate
        run: >-
          node scripts/governance/governance-preflight.mjs
          --ci
          --mode development
          --task-id CI-SRM-GOVERNANCE-PREFLIGHT
          --conversation-id CI-SRM-GOVERNANCE-PREFLIGHT
          --title "SRM Development Governance CI"
          --project SRM
          --target-environment development
          --workspace "GitHub Actions"
          --execution-environment ci
          --scope governance
          --target Canon/registries/profitia-projects-v1.json
          --target Canon/registries/srm-environment-topology-v1.json
          --target scripts/governance/environment-profile.mjs
