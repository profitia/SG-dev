name: Forecast Production Operations

on:
  schedule:
    - cron: '20 07 * * *'
  workflow_dispatch:
    inputs:
      seriesIds:
        description: Comma-separated explicitly enabled series ids
        required: false
      targets:
        description: Comma-separated target semantics
        required: false
        default: END_OF_PERIOD,MONTHLY_AVERAGE,ROLLING_DAILY_POINT_IN_TIME
      models:
        description: Comma-separated Forecast models
        required: false
        default: naive,damped_holt,ets,arima
      historical:
        description: Prepare Historical Verification
        type: boolean
        required: false
        default: false
      maxOriginsPerRun:
        description: Optional positive limit for bounded historical catch-up per run
        required: false

permissions:
  contents: read

concurrency:
  group: sg2-development-forecast-operations
  cancel-in-progress: false

jobs:
  forecast-production-operations:
    runs-on: ubuntu-latest
    environment: sg2-development
    env:
      APP_ENV: development
      SG2_FORECAST_PRODUCER_LANES: CURRENT_ONLY,VERIFICATION_ONLY
      SG2_FORECAST_ALLOWED_SERIES_IDS: ${{ vars.SG2_FORECAST_ALLOWED_SERIES_IDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/sg-runtime/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate scheduler configuration
        env:
          MARKET_DATA_DATABASE_URL: ${{ secrets.SG2_DEVELOPMENT_MARKET_DATA_DATABASE_URL }}
          SERIES_IDS: ${{ github.event.inputs.seriesIds || vars.FORECAST_ENABLED_SERIES_IDS }}
          TARGETS: ${{ github.event.inputs.targets }}
          MODELS: ${{ github.event.inputs.models }}
          MAX_ORIGINS_PER_RUN: ${{ github.event.inputs.maxOriginsPerRun || vars.FORECAST_MAX_ORIGINS_PER_RUN }}
        run: |
          [[ -n "$MARKET_DATA_DATABASE_URL" ]] || { echo "Missing SG2 Development database credential"; exit 1; }
          series_ids="${SERIES_IDS:-}"
          targets="${TARGETS:-END_OF_PERIOD,MONTHLY_AVERAGE,ROLLING_DAILY_POINT_IN_TIME}"
          models="${MODELS:-naive,damped_holt,ets,arima}"
          max_origins_per_run="${MAX_ORIGINS_PER_RUN:-}"
          [[ -n "$series_ids" ]] || { echo "Set workflow input seriesIds or repository variable FORECAST_ENABLED_SERIES_IDS"; exit 1; }
          [[ -n "$targets" ]] || { echo "Targets must not be empty"; exit 1; }
          [[ -n "$models" ]] || { echo "Models must not be empty"; exit 1; }
          if [[ -n "$max_origins_per_run" && ! "$max_origins_per_run" =~ ^[1-9][0-9]*$ ]]; then
            echo "maxOriginsPerRun must be a positive integer when provided"
            exit 1
          fi

      - name: Verify Development database and bounded producer authority (read only)
        env:
          MARKET_DATA_DATABASE_URL: ${{ secrets.SG2_DEVELOPMENT_MARKET_DATA_DATABASE_URL }}
          SERIES_IDS: ${{ github.event.inputs.seriesIds || vars.FORECAST_ENABLED_SERIES_IDS }}
          PREPARE_HISTORICAL: ${{ github.event.inputs.historical || 'false' }}
        run: node scripts/governance/sg2-identity-probe.mjs --producer

      - name: Install sg-runtime dependencies
        working-directory: apps/sg-runtime
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_TOKEN" || { echo "Missing private package read credential NPM_TOKEN"; exit 1; }
          npm ci

      - name: Prepare forecasting Python environment
        working-directory: tooling/Benchmark-Forecasting
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run Forecast production operations
        working-directory: apps/sg-runtime
        env:
          MARKET_DATA_DATABASE_URL: ${{ secrets.SG2_DEVELOPMENT_MARKET_DATA_DATABASE_URL }}
          FORECASTING_LAB_ROOT: ${{ github.workspace }}/tooling/Benchmark-Forecasting
          FORECASTING_PYTHON_BIN: ${{ github.workspace }}/tooling/Benchmark-Forecasting/.venv/bin/python
          SERIES_IDS: ${{ github.event.inputs.seriesIds || vars.FORECAST_ENABLED_SERIES_IDS }}
          TARGETS: ${{ github.event.inputs.targets }}
          MODELS: ${{ github.event.inputs.models }}
          PREPARE_HISTORICAL: ${{ github.event.inputs.historical || 'false' }}
          MAX_ORIGINS_PER_RUN: ${{ github.event.inputs.maxOriginsPerRun || vars.FORECAST_MAX_ORIGINS_PER_RUN }}
        run: |
          series_ids="${SERIES_IDS:-}"
          targets="${TARGETS:-END_OF_PERIOD,MONTHLY_AVERAGE,ROLLING_DAILY_POINT_IN_TIME}"
          models="${MODELS:-naive,damped_holt,ets,arima}"
          max_origins_per_run="${MAX_ORIGINS_PER_RUN:-}"
          IFS=',' read -ra enabled_series <<< "$series_ids"
          for series_id in "${enabled_series[@]}"; do
            [[ -n "$series_id" ]] || continue
            command=(npm run forecast:operations -- --seriesId="$series_id" --targets="$targets" --models="$models" --historical="$PREPARE_HISTORICAL")
            if [[ -n "$max_origins_per_run" ]]; then
              command+=(--maxOriginsPerRun="$max_origins_per_run")
            fi
            "${command[@]}"
          done