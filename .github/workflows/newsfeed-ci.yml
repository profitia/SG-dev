name: Newsfeed connector
on:
  pull_request:
    paths: ['apps/newsfeed-runtime/**', 'packages/newsfeed-contracts/**', '.github/workflows/newsfeed-ci.yml']
  push:
    branches: [main]
    paths: ['apps/newsfeed-runtime/**', 'packages/newsfeed-contracts/**', '.github/workflows/newsfeed-ci.yml']
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate governance and preserved ownership boundaries
        run: >-
          node scripts/governance/validate-governance-manifest.mjs &&
          node --test scripts/governance/governance.test.mjs
          scripts/governance/identity-runtime-onboarding.test.mjs
          scripts/governance/krs-registry-routing.test.mjs
      - name: Install only public test and type tooling without lifecycle scripts
        working-directory: apps/newsfeed-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test connector security, filter semantics and neutral consumer contract
        working-directory: apps/newsfeed-runtime
        run: npm test && npm run typecheck && npm run build
      - name: Verify exact changed paths through Architecture governance
        run: |
          args=()
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            while IFS= read -r target; do args+=(--target "$target"); done < <(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          else
            while IFS= read -r target; do args+=(--target "$target"); done < <(git diff --name-only HEAD^ HEAD)
          fi
          node scripts/governance/governance-preflight.mjs --ci --mode development \
            --project ARCHITECTURE --target-environment development \
            --task-id CI-NEWSFEED-CONNECTOR --conversation-id CI-NEWSFEED-CONNECTOR \
            --title 'Newsfeed connector CI' --scope implementation \
            --workspace 'GitHub Actions' --execution-environment ci "${args[@]}"
      # Provider credentials, paid/live requests and deployments are deliberately absent.
