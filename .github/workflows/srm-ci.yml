name: SRM CI

on:
  pull_request:
    paths:
      - "apps/srm/**"
      - "packages/srm-xray/**"
      - ".github/workflows/srm-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/srm/**"
      - "packages/srm-xray/**"
      - ".github/workflows/srm-ci.yml"

jobs:
  srm-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/srm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/srm/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:promotion
      - run: npm run build
