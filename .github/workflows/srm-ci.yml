name: SRM CI

on:
  pull_request:
    paths:
      ["apps/srm/**", "packages/srm-xray/**", ".github/workflows/srm-ci.yml"]
  push:
    branches: [main]
    paths:
      ["apps/srm/**", "packages/srm-xray/**", ".github/workflows/srm-ci.yml"]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Exact accepted Development release SHA (40 characters)"
        required: true
        type: string
      staging_deployment_authorized:
        description: "Separate explicit Staging deployment authorization"
        type: choice
        options: ["NO", "YES"]
        default: "NO"
      cost_owner:
        description: "Owner accepting Render 7 USD/month, existing Neon max 8 CU, provider/storage/egress/build costs, maximum 3 deployment attempts"
        required: true
        type: string
      initialize:
        description: "Authorize first role/schema/synthetic-organization initialization"
        type: boolean
        default: false
      resume_approval_id:
        description: "Existing unfinished approval ID; empty for a new release"
        type: string
        default: ""
      resume_manifest_digest:
        description: "Exact existing manifest digest; required with resume approval ID"
        type: string
        default: ""
      resume_authorization_renewal:
        description: "Explicit one-hour renewal of the same approval and scope, requiring protected owner review"
        type: choice
        options: ["NO", "YES"]
        default: "NO"

permissions:
  contents: read
  checks: read
  actions: read
  deployments: read

jobs:
  srm-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: srm_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: srm_migration_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRM_MIGRATION_TEST_URL: postgresql://srm_test_owner:isolated_ci_only@127.0.0.1:5432/srm_migration_test
    defaults:
      run:
        working-directory: apps/srm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/srm/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:promotion
      - name: Shared first-onboarding governance tests
        working-directory: .
        run: node --test scripts/governance/srm-release-lifecycle.test.mjs
      - run: npm run build

  srm-staging-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_deployment_authorized == 'YES'
    runs-on: ubuntu-latest
    needs: srm-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix apps/srm ci --install-links
      - name: Verify registered target and owner-review policy before protected job
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          COST_OWNER: ${{ inputs.cost_owner }}
          APPROVED_BY: ${{ github.actor }}
          APPROVAL_ID: SRM-STAGING-${{ github.run_id }}-${{ github.run_attempt }}
          INITIALIZE: ${{ inputs.initialize }}
          RESUME_APPROVAL_ID: ${{ inputs.resume_approval_id }}
          RESUME_MANIFEST_DIGEST: ${{ inputs.resume_manifest_digest }}
          RESUME_RENEWAL: ${{ inputs.resume_authorization_renewal }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {contract,assertAuthorization} from './apps/srm/scripts/staging-migrate.mjs';
          import {assertDispatchTarget} from './apps/srm/scripts/promote-staging.mjs';
          import {verifyLifecycleSource} from './apps/srm/scripts/staging-lifecycle.mjs';
          import {prepareResume} from './apps/srm/scripts/resume-staging.mjs';
          const resume=!!(process.env.RESUME_APPROVAL_ID || process.env.RESUME_MANIFEST_DIGEST);
          let prepared;
          if(resume){
            if(process.env.INITIALIZE==='true')throw Error('Resume cannot initialize another release');
            verifyLifecycleSource(process.env.APPROVED_SHA);
            const state=JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json','utf8'));
            const priorId=/^github-run:(\d+)$/.exec(state.release?.owner)?.[1];
            if(!priorId)throw Error('Existing GitHub executor identity required');
            const run=await fetch('https://api.github.com/repos/'+contract.repository+'/actions/runs/'+priorId,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(30000)});
            if(!run.ok)throw Error('Previous executor proof unavailable');
            prepared=prepareResume(state,{approvalId:process.env.RESUME_APPROVAL_ID,manifestDigest:process.env.RESUME_MANIFEST_DIGEST,sha:process.env.APPROVED_SHA,actor:process.env.APPROVED_BY,costOwner:process.env.COST_OWNER,renewal:process.env.RESUME_RENEWAL},await run.json());
            fs.writeFileSync('/tmp/srm-staging-resume.json',JSON.stringify(prepared));
          }else if(process.env.RESUME_RENEWAL==='YES')throw Error('Renewal requires an existing release identity');
          let a={schemaVersion:'1.0',projectKey:'SRM',targetEnvironment:'staging',stagingDeploymentAuthorized:true,productionMutationsAllowed:false,repository:contract.repository,releaseSha:process.env.APPROVED_SHA,neonProjectId:contract.neon.projectId,neonBranchId:contract.neon.branchId,databaseName:'srm_app',approvalId:process.env.APPROVAL_ID,approvedBy:process.env.APPROVED_BY,costOwner:process.env.COST_OWNER,operations:['deploy','migrate',...(process.env.INITIALIZE==='true'?['initialize']:[])],expiresAt:new Date(Date.now()+3600000).toISOString()};
          if(prepared)a=prepared.authorization;
          else assertAuthorization(a,a.releaseSha,'deploy');
          assertDispatchTarget();
          verifyLifecycleSource(a.releaseSha);
          const response=await fetch('https://api.github.com/repos/'+contract.repository+'/environments/srm-staging',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error('Registered protected GitHub environment unavailable');
          const policy=assertDispatchTarget(await response.json());
          if(prepared && JSON.stringify(a.githubApprovalPolicy)!==JSON.stringify(policy))throw Error('Resume approval policy changed');
          a.githubApprovalPolicy=policy;
          const topology=JSON.parse(fs.readFileSync('Canon/registries/srm-environment-topology-v1.json','utf8'));
          a.renderServiceId=topology.environments.staging.render.services.runtime.serviceId;
          fs.writeFileSync('/tmp/srm-staging-authorization.json',JSON.stringify(a));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: srm-staging-authorization
          path: |
            /tmp/srm-staging-authorization.json
            /tmp/srm-staging-resume.json
          retention-days: 1

  srm-staging-promote:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_deployment_authorized == 'YES'
    needs: srm-staging-guard
    runs-on: ubuntu-latest
    environment: srm-staging
    concurrency:
      group: srm-staging-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix apps/srm ci --install-links
      - uses: actions/download-artifact@v4
        with:
          name: srm-staging-authorization
          path: /tmp/srm-staging-approval
      - name: Promote explicit approved SHA and record sanitized evidence
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SRM_RELEASE_DIAGNOSTIC_PATH: /tmp/srm-staging-diagnostic.json
          TARGET_ENVIRONMENT: staging
          SRM_NEON_PROJECT_ID: snowy-breeze-40315151
          SRM_NEON_BRANCH_ID: br-broad-butterfly-b11t4v01
          SRM_APP_DIRECT_URL: ${{ secrets.SRM_APP_DIRECT_URL }}
          SRM_APP_DATABASE_PASSWORD: ${{ secrets.SRM_APP_DATABASE_PASSWORD }}
          SRM_STAGING_ORGANIZATION_ID: ${{ vars.SRM_STAGING_ORGANIZATION_ID }}
          SRM_STAGING_DEMO_PASSWORD: ${{ secrets.SRM_DEMO_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SRM_RELEASE_GITHUB_TOKEN: ${{ secrets.SRM_RELEASE_GITHUB_TOKEN }}
          SRM_DEMO_PASSWORD: ${{ secrets.SRM_DEMO_PASSWORD }}
          SRM_DEMO_SESSION_SECRET: ${{ secrets.SRM_DEMO_SESSION_SECRET }}
          MGBI_API_KEY: ${{ secrets.MGBI_API_KEY }}
          VERCLY_API_KEY: ${{ secrets.VERCLY_API_KEY }}
          CEIDG_API_KEY: ${{ secrets.CEIDG_API_KEY }}
          VERCLY_API_BASE_URL: ${{ vars.VERCLY_API_BASE_URL }}
          MGBI_AUTH_SCHEME: ${{ vars.MGBI_AUTH_SCHEME }}
        run: |
          node --input-type=module <<'JS'
          const fs=await import('node:fs');
          const {liveEvidence}=await import('./apps/srm/scripts/promote-staging.mjs');
          const {manifestFrom,lifecycleApply}=await import('./apps/srm/scripts/staging-lifecycle.mjs');
          const {contract}=await import('./apps/srm/scripts/staging-migrate.mjs');
          const {digest,operations}=await import('./scripts/governance/srm-release-lifecycle.mjs');
          const old=JSON.parse(fs.readFileSync('/tmp/srm-staging-approval/srm-staging-authorization.json','utf8'));
          const evidence=await liveEvidence(old.releaseSha,{...process.env,GITHUB_TOKEN:process.env.SRM_RELEASE_GITHUB_TOKEN});
          const manifest=manifestFrom({repositoryId:evidence.repositoryId,approvedMainAncestor:evidence.approvedMainAncestor,ciPassed:evidence.ciPassed,developmentLiveSha:evidence.developmentLiveSha},old.releaseSha);
          let a={...old,schemaVersion:'2.0',mode:'promote',stagingMutationsAllowed:true,manifest,manifestDigest:digest(manifest),repositoryId:contract.repositoryId,renderWorkspaceId:contract.render.workspaceId,renderProjectId:contract.render.projectId,renderEnvironmentId:contract.render.environmentId,neonEndpointId:contract.neon.endpointId,operations,budget:{renderPlan:contract.render.plan,renderInstances:1,renderMonthlyComputeUsd:7,neonMaxCu:8,neonExistingEndpointOnly:true,providerEntitlementsAccepted:true,storageEgressBuildCostsAccepted:true,maxDeploymentAttempts:3}};
          if(old.schemaVersion==='2.0'){
            const {assertResumeFence}=await import('./apps/srm/scripts/resume-staging.mjs');
            const {verifyLifecycleSource}=await import('./apps/srm/scripts/staging-lifecycle.mjs');
            verifyLifecycleSource(old.releaseSha);
            const prepared=JSON.parse(fs.readFileSync('/tmp/srm-staging-approval/srm-staging-resume.json','utf8'));
            assertResumeFence(JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json','utf8')),prepared);
            if(!evidence.ciPassed || !evidence.approvedMainAncestor || digest(manifestFrom(old.manifest.source,old.releaseSha))!==old.manifestDigest)throw Error('Existing release source or manifest changed');
            a=old;
          }
          fs.writeFileSync('/tmp/srm-staging-lifecycle-authorization.json',JSON.stringify(a));

          JS
          resume_args=()
          if [ -f /tmp/srm-staging-approval/srm-staging-resume.json ]; then
            resume_args=(--resume-fence /tmp/srm-staging-approval/srm-staging-resume.json)
          fi
          node apps/srm/scripts/promote-staging.mjs --apply --sha "$APPROVED_SHA" --authorization /tmp/srm-staging-lifecycle-authorization.json "${resume_args[@]}" > /tmp/srm-staging-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srm-staging-evidence
          path: |
            /tmp/srm-staging-evidence.json
            /tmp/srm-staging-diagnostic.json
          retention-days: 30
