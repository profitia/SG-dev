name: SRM CI

on:
  pull_request:
    paths:
      - "apps/srm/**"
      - "packages/srm-xray/**"
      - ".github/workflows/srm-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/srm/**"
      - "packages/srm-xray/**"
      - ".github/workflows/srm-ci.yml"

jobs:
  srm-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: srm_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: srm_migration_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRM_MIGRATION_TEST_URL: postgresql://srm_test_owner:isolated_ci_only@127.0.0.1:5432/srm_migration_test
    defaults:
      run:
        working-directory: apps/srm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/srm/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:promotion
      - run: npm run build
