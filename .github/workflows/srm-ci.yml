name: SRM CI

on:
  pull_request:
    paths:
      ["apps/srm/**", "packages/srm-xray/**", ".github/workflows/srm-ci.yml"]
  push:
    branches: [main]
    paths:
      ["apps/srm/**", "packages/srm-xray/**", ".github/workflows/srm-ci.yml"]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Exact accepted Development release SHA (40 characters)"
        required: true
        type: string
      release_mode:
        description: "Promotion or separately reviewed retained-artifact rollback"
        type: choice
        options: ["promote", "rollback"]
        default: "promote"
      staging_deployment_authorized:
        description: "Separate explicit Staging deployment authorization"
        type: choice
        options: ["NO", "YES"]
        default: "NO"
      cost_owner:
        description: "Owner accepting Render 7 USD/month, existing Neon max 8 CU, provider/storage/egress/build costs, maximum 3 deployment attempts"
        required: true
        type: string
      initialize:
        description: "Authorize first role/schema/synthetic-organization initialization"
        type: boolean
        default: false
      resume_approval_id:
        description: "Existing unfinished approval ID; empty for a new release"
        type: string
        default: ""
      resume_manifest_digest:
        description: "Exact existing manifest digest; required with resume approval ID"
        type: string
        default: ""
      resume_authorization_renewal:
        description: "Explicit one-hour renewal of the same approval and scope, requiring protected owner review"
        type: choice
        options: ["NO", "YES"]
        default: "NO"

permissions:
  contents: read
  checks: read
  actions: read
  deployments: read

jobs:
  supplier-summary-react18:
    name: Supplier summary public React18 port
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUMMARY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NPM_TOKEN: ''
      NODE_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Select runner-local isolated consumer directory
        run: printf 'SUMMARY_HOST_FIXTURE=%s/supplier-summary-react18\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare isolated public consumer at the exact source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(sha!==process.env.SUMMARY_SOURCE_SHA)throw Error('Exact supplier module source required');
          const target=process.env.SUMMARY_HOST_FIXTURE;
          fs.mkdirSync(target,{recursive:true});
          fs.writeFileSync(path.join(target,'package.json'),JSON.stringify({
            name:'isolated-supplier-summary-react18',private:true,type:'module',
            dependencies:{'@profitia/srm-xray':`file:${path.join(process.env.GITHUB_WORKSPACE,'packages/srm-xray')}`,
              react:'18.3.1','react-dom':'18.3.1',tsx:'4.23.12',typescript:'5.9.3',
              '@types/react':'18.3.29','@types/react-dom':'18.3.7','@types/node':'20.19.43'}
          },null,2));
          fs.writeFileSync(path.join(target,'tsconfig.json'),JSON.stringify({compilerOptions:{
            target:'ES2022',lib:['ES2022','DOM','DOM.Iterable'],module:'ESNext',moduleResolution:'Bundler',
            jsx:'react-jsx',strict:true,noEmit:true,skipLibCheck:true,esModuleInterop:true
          },include:['*.ts','*.tsx']},null,2));
          fs.copyFileSync('apps/srm/src/server/supplier-module-ports.test.ts',path.join(target,'pure.test.ts'));
          fs.copyFileSync('apps/srm/scripts/supplier-summary-react18.test.tsx',path.join(target,'ui.test.tsx'));
          JS
      - name: Install public packages without credentials or lifecycle execution
        run: npm --prefix "$SUMMARY_HOST_FIXTURE" install --install-links --ignore-scripts --no-audit --no-fund --package-lock=false --registry=https://registry.npmjs.org --userconfig=/dev/null
      - name: Verify pure ports, actual React18 module and type compatibility
        run: |
          cd "$SUMMARY_HOST_FIXTURE"
          node --import tsx --test --test-concurrency=1 pure.test.ts ui.test.tsx
          node_modules/.bin/tsc --noEmit
      - name: Record bounded public-port proof
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          fs.writeFileSync(path.join(process.env.SUMMARY_HOST_FIXTURE,'proof.json'),JSON.stringify({
            sourceSha:process.env.SUMMARY_SOURCE_SHA,scope:'ISOLATED_PUBLIC_SUPPLIER_SUMMARY_PORT',
            reactVersion:'18.3.1',purePortReactResolution:'FORBIDDEN',tests:'PASS',typecheck:'PASS',
            productDeploymentPerformed:false,realSecondApplicationIntegrationVerified:false
          },null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supplier-summary-react18-port-proof
          path: ${{ runner.temp }}/supplier-summary-react18/proof.json
          if-no-files-found: error

  srm-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: srm_test_owner
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: srm_migration_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRM_MIGRATION_TEST_URL: postgresql://srm_test_owner:isolated_ci_only@127.0.0.1:5432/srm_migration_test
    defaults:
      run:
        working-directory: apps/srm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/srm/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:promotion
      - name: PILOT2 exact baseline and environment isolation
        run: node --test scripts/pilot2-baseline.test.mjs scripts/pilot2-instrumentation.test.mjs scripts/pilot2-registry-overlay.test.mjs scripts/pilot2-source-installation.test.mjs
      - name: Shared first-onboarding governance tests
        working-directory: .
        run: node --test scripts/governance/srm-release-lifecycle.test.mjs
      - run: npm run build
      - name: Approved KRS search interaction and responsive regression
        run: npm run test:krs-ui && npm run test:porr-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: srm-porr-account-ui
          path: apps/srm/.next/porr-account-ui-proof
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: krs-name-search-ui-proof
          path: apps/srm/.next/krs-name-ui-proof/
          if-no-files-found: error

  pilot2-baseline-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      source-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pilot2_fixture_admin
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: postgres
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Select PILOT2 preparation changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'apps/srm/scripts/pilot2-*.mjs' apps/srm/src/server/pilot2-registry.ts apps/srm/src/server/supplier-telemetry.ts 'apps/srm/deployment/pilot2-*'; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify historical source then build with Render-compatible shallow history
        if: steps.changes.outputs.build == 'true'
        run: |
          node --test apps/srm/scripts/pilot2-baseline.test.mjs apps/srm/scripts/pilot2-instrumentation.test.mjs apps/srm/scripts/pilot2-registry-overlay.test.mjs apps/srm/scripts/pilot2-source-installation.test.mjs
          git clone --depth 1 --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pilot2-shallow"
          node "$RUNNER_TEMP/pilot2-shallow/apps/srm/scripts/pilot2-baseline.mjs" build
          node "$RUNNER_TEMP/pilot2-shallow/apps/srm/scripts/pilot2-baseline.mjs" build "$RUNNER_TEMP/pilot2-shallow/.pilot2-instrumented" TELEMETRY
          node "$RUNNER_TEMP/pilot2-shallow/apps/srm/scripts/pilot2-baseline.mjs" build "$RUNNER_TEMP/pilot2-shallow/.pilot2-registry" REGISTRY
      - name: Source installation and ordinary-role isolation on PostgreSQL18
        if: steps.changes.outputs.build == 'true'
        env:
          PGPORT: ${{ job.services.source-postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/pilot2-shallow/.pilot2-registry/apps/srm/node_modules
        run: |
          node --input-type=commonjs - <<'JS'
          const {Client}=require('pg');
          (async()=>{const db=new Client({host:'127.0.0.1',port:Number(process.env.PGPORT),user:'pilot2_fixture_admin',password:'isolated_fixture_only',database:'postgres'});await db.connect();
          try{await db.query("CREATE ROLE neondb_owner LOGIN PASSWORD 'fixture_only' NOINHERIT CREATEDB CREATEROLE NOSUPERUSER NOBYPASSRLS");await db.query('CREATE DATABASE krs_registry_pilot OWNER neondb_owner')}finally{await db.end()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          PILOT2_SOURCE_FIXTURE_ADMIN_URL="postgresql://pilot2_fixture_admin:isolated_fixture_only@127.0.0.1:$PGPORT/postgres" PILOT2_SOURCE_FIXTURE_URL="postgresql://neondb_owner:fixture_only@127.0.0.1:$PGPORT/krs_registry_pilot" node --test apps/srm/scripts/pilot2-source-postgres.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.changes.outputs.build == 'true'
        with:
          name: pilot2-baseline-build-proof
          path: ${{ runner.temp }}/pilot2-shallow/.pilot2-baseline/baseline-proof.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.changes.outputs.build == 'true'
        with:
          name: pilot2-registry-build-proof
          path: ${{ runner.temp }}/pilot2-shallow/.pilot2-registry/baseline-proof.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.changes.outputs.build == 'true'
        with:
          name: pilot2-telemetry-build-proof
          path: ${{ runner.temp }}/pilot2-shallow/.pilot2-instrumented/baseline-proof.json
          if-no-files-found: error

  srm-staging-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_deployment_authorized == 'YES'
    runs-on: ubuntu-latest
    needs: srm-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix apps/srm ci --install-links
      - name: Verify registered target and owner-review policy before protected job
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'promote' }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          COST_OWNER: ${{ inputs.cost_owner }}
          APPROVED_BY: ${{ github.actor }}
          APPROVAL_ID: SRM-STAGING-${{ github.run_id }}-${{ github.run_attempt }}
          INITIALIZE: ${{ inputs.initialize }}
          RESUME_APPROVAL_ID: ${{ inputs.resume_approval_id }}
          RESUME_MANIFEST_DIGEST: ${{ inputs.resume_manifest_digest }}
          RESUME_RENEWAL: ${{ inputs.resume_authorization_renewal }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {contract,assertAuthorization} from './apps/srm/scripts/staging-migrate.mjs';
          import {assertDispatchTarget} from './apps/srm/scripts/promote-staging.mjs';
          import {verifyLifecycleSource,manifestFrom} from './apps/srm/scripts/staging-lifecycle.mjs';
          import {prepareResume} from './apps/srm/scripts/resume-staging.mjs';
          import {prepareRollbackPlan} from './apps/srm/scripts/staging-rollback.mjs';
          import {digest} from './scripts/governance/srm-release-lifecycle.mjs';
          const state=JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json'));
          const mode=process.env.RELEASE_MODE;
          if(!['promote','rollback'].includes(mode))throw Error('Unknown release mode');
          if(mode==='rollback' && process.env.INITIALIZE==='true')throw Error('Rollback cannot initialize or migrate');
          const rollbackPlan=(process.env.RESUME_APPROVAL_ID && state.release?.manifest?.rollbackPlan) || prepareRollbackPlan(state,process.env.APPROVED_SHA,undefined,mode);
          if(mode==='rollback' && process.env.APPROVED_SHA!==rollbackPlan.restorePoint.sha)throw Error('Rollback must target exact recorded LKG');
          const resume=!!(process.env.RESUME_APPROVAL_ID || process.env.RESUME_MANIFEST_DIGEST);
          let prepared;
          if(resume){
            if(process.env.INITIALIZE==='true')throw Error('Resume cannot initialize another release');
            verifyLifecycleSource(process.env.APPROVED_SHA,undefined,{mode,rollbackPlan});
            const state=JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json','utf8'));
            const priorId=/^github-run:(\d+)$/.exec(state.release?.owner)?.[1];
            if(!priorId)throw Error('Existing GitHub executor identity required');
            const run=await fetch('https://api.github.com/repos/'+contract.repository+'/actions/runs/'+priorId,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(30000)});
            if(!run.ok)throw Error('Previous executor proof unavailable');
            prepared=prepareResume(state,{approvalId:process.env.RESUME_APPROVAL_ID,manifestDigest:process.env.RESUME_MANIFEST_DIGEST,sha:process.env.APPROVED_SHA,actor:process.env.APPROVED_BY,costOwner:process.env.COST_OWNER,renewal:process.env.RESUME_RENEWAL},await run.json());
            fs.writeFileSync('/tmp/srm-staging-resume.json',JSON.stringify(prepared));
          }else if(process.env.RESUME_RENEWAL==='YES')throw Error('Renewal requires an existing release identity');
          let a={schemaVersion:'1.0',projectKey:'SRM',targetEnvironment:'staging',stagingDeploymentAuthorized:true,productionMutationsAllowed:false,repository:contract.repository,releaseSha:process.env.APPROVED_SHA,neonProjectId:contract.neon.projectId,neonBranchId:contract.neon.branchId,databaseName:'srm_app',approvalId:process.env.APPROVAL_ID,approvedBy:process.env.APPROVED_BY,costOwner:process.env.COST_OWNER,operations:['deploy','migrate',...(process.env.INITIALIZE==='true'?['initialize']:[])],expiresAt:new Date(Date.now()+3600000).toISOString()};
          if(prepared)a=prepared.authorization;
          else assertAuthorization(a,a.releaseSha,'deploy');
          assertDispatchTarget();
          verifyLifecycleSource(a.releaseSha,undefined,{mode,rollbackPlan});
          if(!prepared){
            const checks=await fetch('https://api.github.com/repos/'+contract.repository+'/commits/'+a.releaseSha+'/check-runs?per_page=100',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(30000)});
            if(!checks.ok)throw Error('Exact candidate CI unavailable');
            const ci=await checks.json();
            const check=ci.check_runs?.filter(x=>x.name==='srm-build'&&x.head_sha===a.releaseSha).sort((a,b)=>b.id-a.id)[0];
            if(ci.total_count>100 || check?.conclusion!=='success')throw Error('Exact candidate CI not successful');
            a.releaseMode=mode;a.rollbackPlan=rollbackPlan;a.journalFence={generation:state.generation,journalDigest:digest(state)};
            // Freeze the expected provenance now. Protected execution must
            // independently prove the actual Render source before any mutation.
            a.manifest={...manifestFrom({repositoryId:contract.repositoryId,approvedMainAncestor:true,ciPassed:true,developmentLiveSha:a.releaseSha,provenanceGate:'LIVE_RENDER_PROOF_REQUIRED_BEFORE_MUTATION'},a.releaseSha),rollbackPlan};
            a.manifestDigest=digest(a.manifest);
          }else if(a.mode!==mode)throw Error('Resume cannot change release mode');
          const response=await fetch('https://api.github.com/repos/'+contract.repository+'/environments/srm-staging',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error('Registered protected GitHub environment unavailable');
          const policy=assertDispatchTarget(await response.json());
          if(prepared && JSON.stringify(a.githubApprovalPolicy)!==JSON.stringify(policy))throw Error('Resume approval policy changed');
          a.githubApprovalPolicy=policy;
          const topology=JSON.parse(fs.readFileSync('Canon/registries/srm-environment-topology-v1.json','utf8'));
          a.renderServiceId=topology.environments.staging.render.services.runtime.serviceId;
          fs.writeFileSync('/tmp/srm-staging-authorization.json',JSON.stringify(a));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: srm-staging-authorization
          path: |
            /tmp/srm-staging-authorization.json
            /tmp/srm-staging-resume.json
          retention-days: 1

  srm-staging-promote:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_deployment_authorized == 'YES'
    needs: srm-staging-guard
    runs-on: ubuntu-latest
    environment: srm-staging
    concurrency:
      group: srm-staging-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix apps/srm ci --install-links
      - uses: actions/download-artifact@v4
        with:
          name: srm-staging-authorization
          path: /tmp/srm-staging-approval
      - name: Promote explicit approved SHA and record sanitized evidence
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'promote' }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SRM_RELEASE_DIAGNOSTIC_PATH: /tmp/srm-staging-diagnostic.json
          TARGET_ENVIRONMENT: staging
          SRM_NEON_PROJECT_ID: snowy-breeze-40315151
          SRM_NEON_BRANCH_ID: br-broad-butterfly-b11t4v01
          SRM_APP_DIRECT_URL: ${{ secrets.SRM_APP_DIRECT_URL }}
          SRM_APP_DATABASE_PASSWORD: ${{ secrets.SRM_APP_DATABASE_PASSWORD }}
          SRM_STAGING_ORGANIZATION_ID: ${{ vars.SRM_STAGING_ORGANIZATION_ID }}
          SRM_STAGING_DEMO_PASSWORD: ${{ secrets.SRM_DEMO_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SRM_RELEASE_GITHUB_TOKEN: ${{ secrets.SRM_RELEASE_GITHUB_TOKEN }}
          SRM_DEMO_PASSWORD: ${{ secrets.SRM_DEMO_PASSWORD }}
          SRM_DEMO_SESSION_SECRET: ${{ secrets.SRM_DEMO_SESSION_SECRET }}
          MGBI_API_KEY: ${{ secrets.MGBI_API_KEY }}
          VERCLY_API_KEY: ${{ secrets.VERCLY_API_KEY }}
          CEIDG_API_KEY: ${{ secrets.CEIDG_API_KEY }}
          VERCLY_API_BASE_URL: ${{ vars.VERCLY_API_BASE_URL }}
          MGBI_AUTH_SCHEME: ${{ vars.MGBI_AUTH_SCHEME }}
        run: |
          node --input-type=module <<'JS'
          const fs=await import('node:fs');
          const {liveEvidence}=await import('./apps/srm/scripts/promote-staging.mjs');
          const {manifestFrom,lifecycleApply}=await import('./apps/srm/scripts/staging-lifecycle.mjs');
          const {contract}=await import('./apps/srm/scripts/staging-migrate.mjs');
          const {digest,operations}=await import('./scripts/governance/srm-release-lifecycle.mjs');
          const {assertRuntimeSchema,runtimeMigrations}=await import('./apps/srm/scripts/staging-rollback.mjs');
          const old=JSON.parse(fs.readFileSync('/tmp/srm-staging-approval/srm-staging-authorization.json','utf8'));
          const evidence=await liveEvidence(old.releaseSha,{...process.env,GITHUB_TOKEN:process.env.SRM_RELEASE_GITHUB_TOKEN});
          const mode=old.mode??old.releaseMode;
          const state=JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json'));
          if(old.journalFence && (digest(state)!==old.journalFence.journalDigest || state.generation!==old.journalFence.generation))throw Error('Release journal changed during protected review');
          if(!evidence.ciPassed || !evidence.approvedMainAncestor || (mode==='promote' && evidence.developmentLiveSha!==old.releaseSha))throw Error('Approved source provenance changed');
          const manifest={...manifestFrom(old.manifest.source,old.releaseSha),rollbackPlan:old.manifest.rollbackPlan};
          if(digest(manifest)!==old.manifestDigest)throw Error('Manifest changed after protected review');
          if(mode==='rollback')assertRuntimeSchema(runtimeMigrations(old.releaseSha),manifest.migrations,old.releaseSha);
          let a={...old,schemaVersion:'2.0',mode,rollbackSchemaCompatible:mode==='rollback',stagingMutationsAllowed:true,manifest,manifestDigest:digest(manifest),repositoryId:contract.repositoryId,renderWorkspaceId:contract.render.workspaceId,renderProjectId:contract.render.projectId,renderEnvironmentId:contract.render.environmentId,neonEndpointId:contract.neon.endpointId,operations,budget:{renderPlan:contract.render.plan,renderInstances:1,renderMonthlyComputeUsd:7,neonMaxCu:8,neonExistingEndpointOnly:true,providerEntitlementsAccepted:true,storageEgressBuildCostsAccepted:true,maxDeploymentAttempts:3}};
          if(mode==='rollback' && state.release?.phase!=='VERIFIED')a.supersedes={...old.journalFence,approvalId:state.release.approvalId,owner:state.release.owner};
          if(old.schemaVersion==='2.0'){
            const {assertResumeFence}=await import('./apps/srm/scripts/resume-staging.mjs');
            const {verifyLifecycleSource}=await import('./apps/srm/scripts/staging-lifecycle.mjs');
            verifyLifecycleSource(old.releaseSha,undefined,{mode,rollbackPlan:old.manifest.rollbackPlan});
            const prepared=JSON.parse(fs.readFileSync('/tmp/srm-staging-approval/srm-staging-resume.json','utf8'));
            assertResumeFence(JSON.parse(fs.readFileSync('Canon/registries/srm-staging-release-state-v1.json','utf8')),prepared);
            if(!evidence.ciPassed || !evidence.approvedMainAncestor || digest({...manifestFrom(old.manifest.source,old.releaseSha),rollbackPlan:old.manifest.rollbackPlan})!==old.manifestDigest)throw Error('Existing release source or manifest changed');
            a=old;
          }
          fs.writeFileSync('/tmp/srm-staging-lifecycle-authorization.json',JSON.stringify(a));

          JS
          resume_args=()
          if [ -f /tmp/srm-staging-approval/srm-staging-resume.json ]; then
            resume_args=(--resume-fence /tmp/srm-staging-approval/srm-staging-resume.json)
          fi
          rollback_args=()
          if [ "${RELEASE_MODE}" = "rollback" ]; then rollback_args=(--rollback); fi
          node apps/srm/scripts/promote-staging.mjs "${rollback_args[@]}" --apply --sha "$APPROVED_SHA" --authorization /tmp/srm-staging-lifecycle-authorization.json "${resume_args[@]}" > /tmp/srm-staging-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srm-staging-evidence
          path: |
            /tmp/srm-staging-evidence.json
            /tmp/srm-staging-diagnostic.json
          retention-days: 30
