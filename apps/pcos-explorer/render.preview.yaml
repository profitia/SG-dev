services:
  - type: web
    name: sg2-pcos-cognition-explorer-preview
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: cd apps/pcos-explorer && npm ci --include=dev && npx prisma generate && PCOS_EXPLORER_PREVIEW_MODE=mock npm run build
    startCommand: cd apps/pcos-explorer && npm run start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PCOS_EXPLORER_PREVIEW_MODE
        value: mock
      - key: PCOS_EXPLORER_ENV
        value: SANDBOX
      - key: PCOS_EXPLORER_ORG_ID
        value: pcos-default
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
