name: Data Runtime Validate

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/data-runtime/**'
      - '.github/workflows/data-runtime-validate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'runtime/data-runtime/**'
      - '.github/workflows/data-runtime-validate.yml'

jobs:
  validate-data-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/data-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/data-runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Run safe tests
        run: |
          set -euo pipefail
          test_files=$(find src -type f \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*.test.js' -o -name '*.spec.js' \) | sort)
          if [[ -z "$test_files" ]]; then
            echo 'No safe tests discovered.'
            exit 0
          fi
          node --import tsx --test $test_files

      - name: Build package
        run: npm run build