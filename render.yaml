# render.yaml — SpendGuru 2.0 Render Blueprint
#
# SCOPE:
# This file mixes one Blueprint-owned PMOS service definition with
# provider-managed deployment contract documentation for SG2 runtime services.
# PMOS (pmos-spendguru2-development) is NOT the SG2 application runtime.
# It is a developer workflow tool and must not be used as a substitute for
# the SG2 production or staging runtime.
#
# CANONICAL SG2 RUNTIME TOPOLOGY:
# spendguru-stage is the canonical main SG Runtime deployment.
# - repo: profitia/SG-dev
# - branch: main
# - rootDir: .
# - buildCommand: bash ./scripts/build-sg-runtime-private-service.sh
# - startCommand: cd apps/sg-runtime && npm run start
#
# BENCHMARK-FINDER-CATEGORY-BUILDER is an intentional second deployment of
# apps/sg-runtime for the temporary public benchmark/category surface.
# It remains provider-managed and is not Blueprint-owned in this file.

services:
  # PPF-1 durable background preparation owner. It consumes Postgres-backed
  # jobs and writes only through the canonical SG Runtime forecast services.
  - type: worker
    name: spendguru-forecast-preparation-worker
    runtime: node
    region: frankfurt
    repo: https://github.com/profitia/SG-dev
    rootDir: .
    buildCommand: bash ./scripts/build-sg-runtime-private-service.sh
    startCommand: cd apps/sg-runtime && npm run forecast:worker
    plan: standard
    branch: main
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORECAST_PREPARATION_WORKER_MODE
        value: VERIFICATION_ONLY
      - key: MARKET_DATA_DATABASE_URL
        fromService:
          type: web
          name: spendguru-stage
          envVarKey: MARKET_DATA_DATABASE_URL
      - key: NPM_TOKEN
        fromService:
          type: web
          name: spendguru-stage
          envVarKey: NPM_TOKEN

  # Dedicated Current Forecast fast lane. It shares the same durable Postgres
  # queue and canonical SG Runtime preparation owner, but never claims long
  # Historical Verification jobs.
  - type: worker
    name: spendguru-forecast-current-worker
    runtime: node
    region: frankfurt
    repo: https://github.com/profitia/SG-dev
    rootDir: .
    buildCommand: bash ./scripts/build-sg-runtime-private-service.sh
    startCommand: cd apps/sg-runtime && npm run forecast:worker
    plan: standard
    branch: main
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORECAST_PREPARATION_WORKER_MODE
        value: CURRENT_ONLY
      - key: MARKET_DATA_DATABASE_URL
        fromService:
          type: web
          name: spendguru-stage
          envVarKey: MARKET_DATA_DATABASE_URL
      - key: NPM_TOKEN
        fromService:
          type: web
          name: spendguru-stage
          envVarKey: NPM_TOKEN

  # PMOS — Developer Workflow Tool (dev-time only, NOT SG2 production runtime)
  - type: web
    name: pmos-spendguru2-development
    runtime: node
    rootDir: apps/pmos
    buildCommand: npm install --include=dev && npx prisma generate && npx next build
    startCommand: npm run start
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/pmos/**
        - Canon/registries/profitia-projects-v1.json
        - render.yaml
      ignoredPaths: []
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3200
      - key: NEXT_PUBLIC_APP_URL
        value: https://pmos-spendguru2-development.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
